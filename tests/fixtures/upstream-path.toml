version = 1

[server]
address = "127.0.0.1:8080"

[[upstreams]]
id = "users"
url = "http://127.0.0.1:3001/base"

[[upstreams]]
id = "catalog"
url = "http://127.0.0.1:3002"

[[routes]]
id = "users-api"
path = "/api/users"
methods = ["GET", "POST"]
upstream = "users"

[[routes]]
id = "catalog-api"
path = "/api/catalog"
methods = ["GET"]
upstream = "catalog"
